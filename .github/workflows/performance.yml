name: Performance

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated released Herb versions (oldest first)"
        required: true
        type: string
      herb_ref:
        description: "Optional marcoroth/herb SHA or branch to compare after the releases"
        required: false
        type: string

permissions:
  contents: read

jobs:
  action-view:
    name: ActionView compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout Herb
        if: inputs.herb_ref != ''
        uses: actions/checkout@v4
        with:
          repository: marcoroth/herb
          ref: ${{ inputs.herb_ref }}
          path: herb

      - name: Add LLVM apt repository
        if: inputs.herb_ref != ''
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update

      - name: Install Herb build dependencies
        if: inputs.herb_ref != ''
        run: xargs sudo apt-get install -y --no-install-recommends < herb/Aptfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Herb versions
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          for version in $VERSIONS; do
            gem install herb -v "$version" --no-document
          done

      - name: Build Herb ref
        if: inputs.herb_ref != ''
        working-directory: herb
        run: |
          bundle install --jobs 4
          bundle exec rake templates make compile

      - name: Measure and compare
        env:
          VERSIONS: ${{ inputs.versions }}
          HERB_REF: ${{ inputs.herb_ref }}
        run: |
          set -euo pipefail

          args=()
          for version in $VERSIONS; do
            args+=(--herb "$version")
          done

          if [ -n "$HERB_REF" ]; then
            args+=(--gem-path "$GITHUB_WORKSPACE/herb")
          fi

          NO_COLOR=1 bundle exec bin/corpus performance \
            "${args[@]}" \
            --fail-on-regression \
            --max-regression 0.05 \
            --absolute-budget 7.0 | tee performance.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Production ActionView compilation'
            echo
            echo '```'
            cat performance.txt 2>/dev/null || echo "the comparison did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-view-performance-runs
          path: runs/action-view/
          if-no-files-found: ignore
          retention-days: 90
