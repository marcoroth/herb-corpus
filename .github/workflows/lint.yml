name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Consistency checks
        run: bundle exec bin/check

      - name: Formatting
        run: |
          if ! bundle exec yerba check; then
            echo "::error title=corpus.yml needs formatting::Run \`yerba apply\` and commit the result."
            exit 1
          fi
