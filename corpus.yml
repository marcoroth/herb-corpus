# Herb corpus manifest.
#
# Git is the source of truth for *where* each app comes from and *what commit*
# it is pinned to: clone URL and tracked branch live in .gitmodules, the pinned
# SHA lives in the superproject tree. This file records everything git cannot:
# provenance, licensing, and why a given app is pinned where it is.
#
# Ordering and key order are enforced by `yerba apply`; see the Yerbafile.
#
# Fields:
#   name            directory under apps/, and the name every command takes
#   repo            owner/name of the remote the submodule points at
#   upstream        canonical project, when `repo` is a fork we maintain
#   fork            true when we track our own fork rather than upstream
#   license         SPDX-ish identifier, or `unknown` when we could not verify
#   license_file    path to the license text within the app, if present
#   redistributable whether `bin/corpus extract` may vendor this app`s source
#   note            why this app is here, or why it is pinned off upstream
#
# Entries with `license: unknown` are marked `redistributable: false` until the
# license is confirmed, which keeps them out of erb/ while leaving them
# available under apps/ for local testing.

apps:
