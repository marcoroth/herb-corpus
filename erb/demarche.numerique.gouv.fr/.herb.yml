# Configuration for the Herb ERB toolchain (linter + formatter).
# See https://herb-tools.dev/configuration
#
# `version` pins which linter rules are enabled: rules introduced in a later
# Herb release stay off until this version is bumped. Raising it to the current
# release enables ~20 more rules (235 offenses to triage as of 0.10.2), so it is
# meant to be bumped deliberately, not as a side effect of a package upgrade.
version: 0.8.9

linter:
  enabled: true

  # The map of France is a single inline SVG holding ~100 `svg_path` calls, each
  # with a multi-kilobyte `d` attribute. Herb 0.10 gives the parser a 1000 ms
  # per-file budget (not configurable), and that template alone eats it on the
  # CI runners. The formatter parses it fine, so it stays formatted; only the
  # linter skips it.
  exclude:
    - 'app/views/carte/show.html.erb'

  rules:
    # The "connected as <profile>" entry of the account dropdown is a label
    # rendered as a link. Turning it into a span needs a visual check on the
    # DSFR nav styles, see the TODO in the template.
    html-anchor-require-href:
      exclude:
        - 'app/components/account_dropdown_component/**'
        # /patron is the internal styleguide: every button, tab and dropdown on
        # it is a dead sample whose `href="#"` is exactly what makes it inert.
        # Turning them into `<button>` would change the very markup the page
        # documents.
        - 'app/views/root/patron.html.erb'

formatter:
  enabled: true
  indentWidth: 2
  maxLineLength: 80

  # Default email bodies: their whitespace is content, not layout. The rendered
  # HTML is stored as the template body an admin then edits, and its newlines
  # are turned into spaces by EmailTemplateConcern.default_for_procedure, so
  # indenting these files would put stray spaces inside the emails we send.
  exclude:
    - 'app/views/notification_mailer/default_templates/**'
