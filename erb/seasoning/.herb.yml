framework: "actionview"
version: 0.11.1

files:
  exclude:
    - "coverage/**/*"
    - "node_modules/**/*"
    - "public/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

linter:
  enabled: true
  failLevel: "hint"

  rules:
    all:
      enabled: true

    # FIXME: enable
    erb-no-unsafe-raw:
      enabled: false

formatter:
  enabled: true
