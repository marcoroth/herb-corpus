framework: "actionview"

files:
  exclude:
    - "coverage/**/*"
    - "node_modules/**/*"
    - "public/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

linter:
  enabled: true

  rules:
    # FIXME: enable
    actionview-prefer-qualified-partial-path:
      enabled: false

    # FIXME: enable
    erb-no-duplicate-branch-elements:
      enabled: false

    # FIXME: enable
    erb-no-interpolated-class-names:
      enabled: false

    # FIXME: enable
    erb-no-unsafe-raw:
      enabled: false

formatter:
  enabled: true
